name: Pipeline de sécurité

on:
  push:
  pull_request:

jobs:
  tests:
    name: Suite de tests de sécurité
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm ci
      - run: npm test

  secrets:
    name: Scanner de secrets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Scan gitleaks
        run: |
          docker run --rm -v "$PWD:/repo" \
            ghcr.io/gitleaks/gitleaks:latest \
            git /repo --config /repo/.gitleaks.toml --redact -v --exit-code=2
  
  dependencies:
    name: Dépendances connues (npm audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm audit --audit-level=high  